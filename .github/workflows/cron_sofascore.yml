name: Scraper Horario SofaScore

on:
  schedule:
    - cron: '11,33,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar-resultados:
    runs-on: self-hosted
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
      
    steps:
      - name: 🛡️ Comprobar ventana de fechas (Mundial 2026)
        id: date_check
        run: |
          $TODAY = (Get-Date).ToString("yyyyMMdd")
          $START = "20260611"
          $END = "20260720"
          
          if ($TODAY -ge $START -and $TODAY -le $END) {
            echo "is_active=true" >> $env:GITHUB_OUTPUT
            Write-Host "🟢 Dentro de las fechas del torneo. Arrancando motores."
          } else {
            echo "is_active=false" >> $env:GITHUB_OUTPUT
            Write-Host "🔴 Fuera de la fecha del torneo. Abortando ejecución silenciosamente."
          }

      - name: Clonar el repositorio
        if: steps.date_check.outputs.is_active == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python
        if: steps.date_check.outputs.is_active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        if: steps.date_check.outputs.is_active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Ejecutar Extractor SofaScore
        if: steps.date_check.outputs.is_active == 'true'
        run: |
          python scripts/05_extractor_sofascore.py

      - name: 💾 Guardar cambios (Auto-Commit)
        if: steps.date_check.outputs.is_active == 'true'
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/resultados/realidad_oficial.json
          
          $changes = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "No hay cambios nuevos en los resultados de SofaScore."
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
          } else {
            git commit -m "Auto-Update: Resultados en vivo actualizados desde SofaScore"
            git push
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
            Write-Host "Cambios subidos a la rama principal."
          }

      - name: 🚀 Lanzar Actualizador Global
        if: steps.commit_step.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Arranca el actualizador mediante GitHub CLI
          gh workflow run actualizador.yml
