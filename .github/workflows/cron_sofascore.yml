name: Scraper Horario SofaScore

on:
  schedule:
    # Se ejecuta en el minuto 0 de cada hora (* * * * * significa cada minuto, 0 es la hora en punto)
    - cron: '0 * * * *'
  # Dejamos el botón manual por si quieres forzar una actualización
  workflow_dispatch:

# Necesitamos permisos para subir código (contents) y llamar al otro workflow (actions)
permissions:
  contents: write
  actions: write

jobs:
  actualizar-resultados:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Comprobar ventana de fechas (Mundial 2026)
        id: date_check
        run: |
          # Formato YYYYMMDD
          TODAY=$(date +%Y%m%d)
          START=20260611 # 09 de Junio de 2026
          END=20260720   # 20 de Julio de 2026 (Dejamos un día extra por diferencias horarias)
          
          if [ "$TODAY" -ge "$START" ] && [ "$TODAY" -le "$END" ]; then
            echo "is_active=true" >> $GITHUB_OUTPUT
            echo "🟢 Dentro de las fechas del torneo. Arrancando motores."
          else
            echo "is_active=false" >> $GITHUB_OUTPUT
            echo "🔴 Fuera de la fecha del torneo. Abortando ejecución silenciosamente."
          fi

      - name: Clonar el repositorio
        if: steps.date_check.outputs.is_active == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python
        if: steps.date_check.outputs.is_active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        if: steps.date_check.outputs.is_active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Ejecutar Extractor SofaScore
        if: steps.date_check.outputs.is_active == 'true'
        run: |
          python scripts/05_extractor_sofascore.py

      - name: 💾 Guardar cambios (Auto-Commit)
        if: steps.date_check.outputs.is_active == 'true'
        id: commit_step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/resultados/realidad_oficial.json
          
          # Comprobamos si el extractor ha cambiado algo realmente
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en los resultados de SofaScore."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-Update: Resultados en vivo actualizados desde SofaScore"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Cambios subidos a la rama principal."
          fi

      - name: 🚀 Lanzar Actualizador Global
        if: steps.commit_step.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Como hubo cambios reales, disparamos la cascada completa
          gh workflow run actualizador.yml