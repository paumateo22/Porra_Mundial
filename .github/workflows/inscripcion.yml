name: Procesar Nuevas Inscripciones

on:
  push:
    # El secreto está aquí: Este Action SOLO saltará si hay cambios en este archivo exacto
    paths:
      - 'inscripcion.csv'
    branches:
      - main

# Permisos: 'contents' para hacer el commit, 'actions' para poder llamar al otro workflow
permissions:
  contents: write
  actions: write

jobs:
  registrar-jugador:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extraer y generar carpetas de jugadores
        run: |
          python scripts/05b_extractor_jugadores.py

      - name: Guardar cambios y subir a GitHub (Auto-Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add participantes/
          # Si no hay jugadores nuevos, no hace commit para no ensuciar
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Nuevos participantes registrados desde CSV" && git push)

      - name: Lanzar el actualizador global (Cascada)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Llamamos al otro workflow directamente para evitar el bloqueo de bucles de GitHub
          gh workflow run actualizador.yml